<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 776" role="img" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto">
<defs>
<linearGradient id="panelGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#f8fafc"/>
</linearGradient>
<pattern id="diagonalHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="8" stroke="#cdd6e1" stroke-width="3"/>
</pattern>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9fb0c2" flood-opacity="0.18"/>
</filter>
<style>
.canvas { fill: #f3f6fa; }
.title { font: 700 26px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #12263a; }
.subtitle { font: 400 14px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #5c6b7a; }
.axis { font: 600 14px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.label { font: 500 13px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.metric { font: 700 20px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #12263a; }
.celltext { font: 700 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
.celltext-dark { font: 700 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #173042; }
.cellsub { font: 500 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: rgba(255,255,255,0.88); }
.cellsub-dark { font: 600 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #385062; }
.body { font: 500 12px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.small { font: 500 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #5c6b7a; }
.tiny { font: 600 10px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #6b7c8f; letter-spacing: 0.04em; }
.grid { fill: #ffffff; stroke: #d7dee6; stroke-width: 1.25; }
.panel { fill: url(#panelGradient); stroke: #dbe4ee; stroke-width: 1.25; filter: url(#softShadow); }
.subpanel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
.legend-card { fill: #ffffff; stroke: #dbe4ee; stroke-width: 1; }
.guide { stroke: #d7dee6; stroke-width: 1; stroke-dasharray: 4 6; }
.baseline { stroke: #aab7c6; stroke-width: 1.1; }
.muted-cell { fill: #eef2f7; stroke: #d7dee6; stroke-width: 1; }
.muted-bar { fill: #ecf1f6; stroke: #d7dee6; stroke-width: 1; }
.outline { stroke: rgba(255,255,255,0.9); stroke-width: 1; }
</style>
</defs>
<rect x="0" y="0" width="1500" height="776" class="canvas"/>
<rect x="24" y="24" width="1452" height="728" rx="22" class="panel"/>
<title>Same-model paper calibration bridge</title>
<desc>Data-backed visual bridge showing exact same-model paper calibration evidence only. Route-probe, near-route, blocked, and proxy rows are kept out of the plotted comparison.</desc>
<text x="48" y="64" class="title">Same-Model Paper Calibration Bridge</text>
<text x="48" y="90" class="subtitle">Only exact same-model evidence is plotted here. Near-family, route-probe, blocked, and proxy rows stay in the ledger CSV.</text>
<text x="48" y="112" class="subtitle">CCD rows are cultural-choice distribution comparisons, not accuracy. UniMoral uses a task bridge because paper and repo metrics differ.</text>
<text x="56" y="156" class="tiny">BENCHMARK</text>
<text x="198" y="156" class="tiny">PAPER MODEL / METRIC</text>
<text x="514" y="156" class="tiny">THIS REPO EVIDENCE</text>
<text x="820" y="156" class="tiny">ONE-TO-ONE VALUE WHEN VALID</text>
<text x="1198" y="156" class="tiny">STATUS AND BOUNDARY</text>
<rect x="42" y="176" width="1416" height="96" rx="14" class="subpanel"/>
<rect x="42" y="176" width="8" height="96" rx="4" fill="#2563eb"/>
<text x="56" y="204" class="label">UniMoral</text>
<text x="198" y="200" class="body">Llama-3.1-8B Instruct: Paper weighted F1 / METEOR</text>
<text x="198" y="217" class="body">/ BERTScore = RQ1 66.17; RQ2 57.01; RQ3 38.59; RQ4</text>
<text x="198" y="234" class="body">METEOR 19.08 and BERTScore 87.44</text>
<text x="514" y="200" class="body">meta-llama/llama-3.1-8b-instruct current</text>
<text x="514" y="217" class="body">full-grid: Accuracy for RQ1-RQ3; live METEOR</text>
<text x="514" y="234" class="body">for RQ4 = RQ1 0.628757; RQ2 0.595074; RQ3</text>
<text x="514" y="251" class="body">0.599943; RQ4 METEOR 0.124689</text>
<text x="820" y="214" class="small">paper: metric scale differs</text>
<text x="820" y="242" class="small">ours: metric scale differs</text>
<circle cx="1182" cy="204" r="7" fill="#2563eb"/>
<text x="1198" y="204" class="body">current full grid verified; Exact same</text>
<text x="1198" y="221" class="body">model, but paper and repo metric</text>
<text x="1198" y="238" class="body">scales differ; compare direction and</text>
<text x="1198" y="255" class="body">task coverage, not a one-number delta.</text>
<rect x="42" y="288" width="1416" height="96" rx="14" class="subpanel"/>
<rect x="42" y="288" width="8" height="96" rx="4" fill="#b45309"/>
<text x="56" y="316" class="label">CCD-Bench</text>
<text x="198" y="312" class="body">Mistral Nemo: Nordic Europe top-cluster share =</text>
<text x="198" y="329" class="body">0.190</text>
<text x="514" y="312" class="body">May 13 Mistral Nemo saved/prior follow-up:</text>
<text x="514" y="329" class="body">Nordic Europe dominant-cluster share =</text>
<text x="514" y="346" class="body">0.2534435262</text>
<rect x="820" y="310" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="820" y="310" width="103.1" height="16" rx="8" fill="#2563eb"/>
<text x="1020" y="323" class="small">paper 19.0%</text>
<rect x="820" y="338" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="820" y="338" width="137.6" height="16" rx="8" fill="#0f766e"/>
<text x="1020" y="351" class="small">ours 25.3%</text>
<circle cx="1182" cy="316" r="7" fill="#b45309"/>
<text x="1198" y="316" class="body">saved prior verified; CCD is</text>
<text x="1198" y="333" class="body">distributional behavior, not accuracy;</text>
<text x="1198" y="350" class="body">saved/prior evidence is not a fresh</text>
<text x="1198" y="367" class="body">rerun.</text>
<rect x="42" y="400" width="1416" height="96" rx="14" class="subpanel"/>
<rect x="42" y="400" width="8" height="96" rx="4" fill="#0f766e"/>
<text x="56" y="428" class="label">CCD-Bench</text>
<text x="198" y="424" class="body">Llama-3.3-70B-Instruct: Nordic Europe top-cluster</text>
<text x="198" y="441" class="body">share = 0.197</text>
<text x="514" y="424" class="body">Llama-M current release row: Nordic Europe</text>
<text x="514" y="441" class="body">dominant-cluster share = 0.20553731</text>
<rect x="820" y="422" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="820" y="422" width="106.9" height="16" rx="8" fill="#2563eb"/>
<text x="1020" y="435" class="small">paper 19.7%</text>
<rect x="820" y="450" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="820" y="450" width="111.6" height="16" rx="8" fill="#0f766e"/>
<text x="1020" y="463" class="small">ours 20.6%</text>
<circle cx="1182" cy="428" r="7" fill="#0f766e"/>
<text x="1198" y="428" class="body">current release verified; CCD is</text>
<text x="1198" y="445" class="body">distributional behavior, not accuracy;</text>
<text x="1198" y="462" class="body">current row has valid-choice gaps.</text>
<text x="48" y="540" class="metric">What is deliberately outside this plotted bridge</text>
<text x="48" y="564" class="subtitle">The full ledger keeps these rows visible for planning, but they are not shown as paper-model comparisons.</text>
<rect x="48" y="588" width="440" height="124" rx="14" class="subpanel"/>
<rect x="48" y="588" width="8" height="124" rx="4" fill="#2563eb"/>
<text x="70" y="620" class="label">Exact paper routes needing runs</text>
<text x="70" y="654" class="body">Some paper CCD models are available as exact provider</text>
<text x="70" y="671" class="body">routes, but the release does not yet have their</text>
<text x="70" y="688" class="body">checked distribution rows. They live in the ledger CSV</text>
<text x="70" y="705" class="body">until run.</text>
<rect x="518" y="588" width="440" height="124" rx="14" class="subpanel"/>
<rect x="518" y="588" width="8" height="124" rx="4" fill="#64748b"/>
<text x="540" y="620" class="label">Unavailable or blocked routes</text>
<text x="540" y="654" class="body">Some UniMoral, Kaleido, Gemini, Grok, Jamba, and</text>
<text x="540" y="671" class="body">MoralPrompt paths are unavailable, gated, or missing</text>
<text x="540" y="688" class="body">local paper-faithful data.</text>
<rect x="988" y="588" width="440" height="124" rx="14" class="subpanel"/>
<rect x="988" y="588" width="8" height="124" rx="4" fill="#b45309"/>
<text x="1010" y="620" class="label">Route probes stay separate</text>
<text x="1010" y="654" class="body">One-sample route checks prove the harness can call a</text>
<text x="1010" y="671" class="body">model; they do not become calibration results or</text>
<text x="1010" y="688" class="body">performance rows.</text>
<text x="48" y="718" class="small">Source tables: paper-model-calibration-bridge.csv and paper-model-calibration-ledger.csv. Read as calibration evidence, not a leaderboard.</text>
</svg>
