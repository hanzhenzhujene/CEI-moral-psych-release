<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1160" role="img" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto">
<defs>
<linearGradient id="panelGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#f8fafc"/>
</linearGradient>
<pattern id="diagonalHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="8" stroke="#cdd6e1" stroke-width="3"/>
</pattern>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9fb0c2" flood-opacity="0.18"/>
</filter>
<style>
.canvas { fill: #f3f6fa; }
.title { font: 700 26px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #12263a; }
.subtitle { font: 400 14px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #5c6b7a; }
.axis { font: 600 14px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.label { font: 500 13px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.metric { font: 700 20px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #12263a; }
.celltext { font: 700 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
.celltext-dark { font: 700 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #173042; }
.cellsub { font: 500 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: rgba(255,255,255,0.88); }
.cellsub-dark { font: 600 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #385062; }
.body { font: 500 12px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.small { font: 500 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #5c6b7a; }
.tiny { font: 600 10px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #6b7c8f; letter-spacing: 0.04em; }
.grid { fill: #ffffff; stroke: #d7dee6; stroke-width: 1.25; }
.panel { fill: url(#panelGradient); stroke: #dbe4ee; stroke-width: 1.25; filter: url(#softShadow); }
.subpanel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
.legend-card { fill: #ffffff; stroke: #dbe4ee; stroke-width: 1; }
.guide { stroke: #d7dee6; stroke-width: 1; stroke-dasharray: 4 6; }
.baseline { stroke: #aab7c6; stroke-width: 1.1; }
.muted-cell { fill: #eef2f7; stroke: #d7dee6; stroke-width: 1; }
.muted-bar { fill: #ecf1f6; stroke: #d7dee6; stroke-width: 1; }
.outline { stroke: rgba(255,255,255,0.9); stroke-width: 1; }
</style>
</defs>
<rect x="0" y="0" width="1500" height="1160" class="canvas"/>
<rect x="24" y="24" width="1452" height="1112" rx="22" class="panel"/>
<title>Paper-model calibration bridge</title>
<desc>Visual bridge showing which original-paper model rows have same, near, saved/prior, reference-family, or blocked comparison evidence in the current release.</desc>
<text x="48" y="64" class="title">Paper-Model Calibration Bridge</text>
<text x="48" y="90" class="subtitle">Use this to answer: did we run the same models as the papers, and can the results be compared directly?</text>
<text x="48" y="112" class="subtitle">Only UniMoral RQ1 is an accuracy-style paper overlap here. CCD rows compare dominant cultural-cluster share, not accuracy.</text>
<text x="56" y="156" class="tiny">BENCHMARK</text>
<text x="198" y="156" class="tiny">PAPER / REFERENCE SIDE</text>
<text x="500" y="156" class="tiny">THIS REPO SIDE</text>
<text x="796" y="156" class="tiny">NUMERIC BRIDGE WHERE VALID</text>
<text x="1198" y="156" class="tiny">STATUS AND READER RULE</text>
<rect x="42" y="176" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="176" width="8" height="84" rx="4" fill="#b45309"/>
<text x="56" y="203" class="label">UniMoral</text>
<text x="198" y="199" class="body">Llama-3.1-8B in paper roster: Paper includes</text>
<text x="198" y="216" class="body">Llama 3.1 8B RQ tables; exact paper values are</text>
<text x="198" y="233" class="body">not tracked here.</text>
<text x="500" y="199" class="body">May 13 Llama 3.1 8B saved row: Saved/prior</text>
<text x="500" y="216" class="body">RQ1 action accuracy 0.639.</text>
<text x="796" y="212" class="small">no tracked paper-side value</text>
<circle cx="1182" cy="204" r="7" fill="#b45309"/>
<text x="1198" y="204" class="body">Saved/prior only: Useful for</text>
<text x="1198" y="221" class="body">capability-floor context, not a fresh</text>
<text x="1198" y="238" class="body">full RQ1-RQ4 rerun.</text>
<rect x="42" y="274" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="274" width="8" height="84" rx="4" fill="#2563eb"/>
<text x="56" y="301" class="label">CCD-Bench</text>
<text x="198" y="297" class="body">DeepSeek-chat-v3-0324: Paper top Nordic Europe</text>
<text x="198" y="314" class="body">22.9%.</text>
<text x="500" y="297" class="body">DeepSeek-M: Current Nordic Europe 22.6%;</text>
<text x="500" y="314" class="body">effective clusters 7.99.</text>
<rect x="796" y="294" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="294" width="124.3" height="16" rx="8" fill="#2563eb"/>
<text x="996" y="307" class="small">paper 22.9%</text>
<rect x="796" y="322" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="322" width="122.7" height="16" rx="8" fill="#0f766e"/>
<text x="996" y="335" class="small">ours 22.6%</text>
<circle cx="1182" cy="302" r="7" fill="#2563eb"/>
<text x="1198" y="302" class="body">Close route: Compare cultural-cluster</text>
<text x="1198" y="319" class="body">behavior; version differs.</text>
<rect x="42" y="372" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="372" width="8" height="84" rx="4" fill="#0f766e"/>
<text x="56" y="399" class="label">CCD-Bench</text>
<text x="198" y="395" class="body">Llama-3.3-70B-Instruct: Paper top Nordic Europe</text>
<text x="198" y="412" class="body">19.7%.</text>
<text x="500" y="395" class="body">Llama-M: Current Nordic Europe 20.6%;</text>
<text x="500" y="412" class="body">effective clusters 8.03.</text>
<rect x="796" y="392" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="392" width="106.9" height="16" rx="8" fill="#2563eb"/>
<text x="996" y="405" class="small">paper 19.7%</text>
<rect x="796" y="420" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="420" width="111.8" height="16" rx="8" fill="#0f766e"/>
<text x="996" y="433" class="small">ours 20.6%</text>
<circle cx="1182" cy="400" r="7" fill="#0f766e"/>
<text x="1198" y="400" class="body">Closest direct row: Direct CCD</text>
<text x="1198" y="417" class="body">behavior bridge, not an accuracy</text>
<text x="1198" y="434" class="body">comparison.</text>
<rect x="42" y="470" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="470" width="8" height="84" rx="4" fill="#0f766e"/>
<text x="56" y="497" class="label">CCD-Bench</text>
<text x="198" y="493" class="body">Llama-4-Maverick: Paper top Nordic Europe 21.1%.</text>
<text x="500" y="493" class="body">Llama-L: Current Nordic Europe 23.5%;</text>
<text x="500" y="510" class="body">effective clusters 7.67.</text>
<rect x="796" y="490" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="490" width="114.5" height="16" rx="8" fill="#2563eb"/>
<text x="996" y="503" class="small">paper 21.1%</text>
<rect x="796" y="518" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="518" width="127.6" height="16" rx="8" fill="#0f766e"/>
<text x="996" y="531" class="small">ours 23.5%</text>
<circle cx="1182" cy="498" r="7" fill="#0f766e"/>
<text x="1198" y="498" class="body">Closest direct row: Compare behavior</text>
<text x="1198" y="515" class="body">while keeping coverage caveat visible.</text>
<rect x="42" y="568" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="568" width="8" height="84" rx="4" fill="#334155"/>
<text x="56" y="595" class="label">CCD-Bench</text>
<text x="198" y="591" class="body">OpenAI GPT-4.1: Paper top Nordic Europe 21.5%.</text>
<text x="500" y="591" class="body">GPT-4.1-mini Ref: Current Nordic Europe</text>
<text x="500" y="608" class="body">22.4%; effective clusters 8.07.</text>
<rect x="796" y="588" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="588" width="116.7" height="16" rx="8" fill="#2563eb"/>
<text x="996" y="601" class="small">paper 21.5%</text>
<rect x="796" y="616" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="616" width="121.6" height="16" rx="8" fill="#0f766e"/>
<text x="996" y="629" class="small">ours 22.4%</text>
<circle cx="1182" cy="596" r="7" fill="#334155"/>
<text x="1198" y="596" class="body">Reference family: OpenAI calibration</text>
<text x="1198" y="613" class="body">marker, not the exact paper variant.</text>
<rect x="42" y="666" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="666" width="8" height="84" rx="4" fill="#64748b"/>
<text x="56" y="693" class="label">CCD-Bench</text>
<text x="198" y="689" class="body">Qwen2.5-72B-Instruct: Paper top Nordic Europe</text>
<text x="198" y="706" class="body">17.7%.</text>
<text x="500" y="689" class="body">Qwen-L: Current Nordic Europe 23.4%;</text>
<text x="500" y="706" class="body">effective clusters 7.97.</text>
<rect x="796" y="686" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="686" width="96.1" height="16" rx="8" fill="#2563eb"/>
<text x="996" y="699" class="small">paper 17.7%</text>
<rect x="796" y="714" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="714" width="127.0" height="16" rx="8" fill="#0f766e"/>
<text x="996" y="727" class="small">ours 23.4%</text>
<circle cx="1182" cy="694" r="7" fill="#64748b"/>
<text x="1198" y="694" class="body">Family only: Same broad family,</text>
<text x="1198" y="711" class="body">different text route.</text>
<rect x="42" y="764" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="764" width="8" height="84" rx="4" fill="#b45309"/>
<text x="56" y="791" class="label">CCD-Bench</text>
<text x="198" y="787" class="body">Mistral Nemo: Paper top Nordic Europe 19.0%.</text>
<text x="500" y="787" class="body">May 13 Mistral Nemo: Saved/prior Nordic</text>
<text x="500" y="804" class="body">Europe 25.3%; effective clusters 7.22.</text>
<rect x="796" y="784" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="784" width="103.1" height="16" rx="8" fill="#2563eb"/>
<text x="996" y="797" class="small">paper 19.0%</text>
<rect x="796" y="812" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="812" width="137.3" height="16" rx="8" fill="#0f766e"/>
<text x="996" y="825" class="small">ours 25.3%</text>
<circle cx="1182" cy="792" r="7" fill="#b45309"/>
<text x="1198" y="792" class="body">Saved/prior: Exploratory saved</text>
<text x="1198" y="809" class="body">artifact, not a fresh rerun.</text>
<text x="48" y="888" class="metric">Blocked or non-equivalent paper replication</text>
<text x="48" y="912" class="subtitle">These rows should stay visible so reviewers do not mistake current benchmark evidence for paper-faithful replication.</text>
<rect x="48" y="936" width="440" height="128" rx="14" class="subpanel"/>
<rect x="48" y="936" width="8" height="128" rx="4" fill="#7c3aed"/>
<text x="70" y="968" class="label">Value Kaleidoscope / ValuePrism</text>
<text x="70" y="1002" class="body">Prompt rows are current benchmark evidence. They are</text>
<text x="70" y="1019" class="body">not Kaleido model replication until gated Kaleido</text>
<text x="70" y="1036" class="body">models are run.</text>
<rect x="518" y="936" width="440" height="128" rx="14" class="subpanel"/>
<rect x="518" y="936" width="8" height="128" rx="4" fill="#64748b"/>
<text x="540" y="968" class="label">SMID</text>
<text x="540" y="1002" class="body">No original LLM model roster was identified locally.</text>
<text x="540" y="1019" class="body">Use current vision rows only for within-repo</text>
<text x="540" y="1036" class="body">comparison.</text>
<rect x="988" y="936" width="440" height="128" rx="14" class="subpanel"/>
<rect x="988" y="936" width="8" height="128" rx="4" fill="#b45309"/>
<text x="1010" y="968" class="label">DeNEVIL / MoralPrompt</text>
<text x="1010" y="1002" class="body">Current evidence is FULCRA proxy behavior. It is not</text>
<text x="1010" y="1019" class="body">Tier 3 paper-faithful MoralPrompt comparison.</text>
<text x="48" y="1102" class="small">Source tables: paper-result-alignment.csv, paper-model-overlap-map.csv, CCD choice distributions, and saved/prior May 13 calibration artifacts.</text>
</svg>
