<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto">
<defs>
<linearGradient id="panelGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#f8fafc"/>
</linearGradient>
<pattern id="diagonalHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="8" stroke="#cdd6e1" stroke-width="3"/>
</pattern>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9fb0c2" flood-opacity="0.18"/>
</filter>
<style>
.canvas { fill: #f3f6fa; }
.title { font: 700 26px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #12263a; }
.subtitle { font: 400 14px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #5c6b7a; }
.axis { font: 600 14px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.label { font: 500 13px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.metric { font: 700 20px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #12263a; }
.celltext { font: 700 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
.celltext-dark { font: 700 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #173042; }
.cellsub { font: 500 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: rgba(255,255,255,0.88); }
.cellsub-dark { font: 600 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #385062; }
.body { font: 500 12px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.small { font: 500 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #5c6b7a; }
.tiny { font: 600 10px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #6b7c8f; letter-spacing: 0.04em; }
.grid { fill: #ffffff; stroke: #d7dee6; stroke-width: 1.25; }
.panel { fill: url(#panelGradient); stroke: #dbe4ee; stroke-width: 1.25; filter: url(#softShadow); }
.subpanel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
.legend-card { fill: #ffffff; stroke: #dbe4ee; stroke-width: 1; }
.guide { stroke: #d7dee6; stroke-width: 1; stroke-dasharray: 4 6; }
.baseline { stroke: #aab7c6; stroke-width: 1.1; }
.muted-cell { fill: #eef2f7; stroke: #d7dee6; stroke-width: 1; }
.muted-bar { fill: #ecf1f6; stroke: #d7dee6; stroke-width: 1; }
.outline { stroke: rgba(255,255,255,0.9); stroke-width: 1; }
</style>
</defs>
<rect x="0" y="0" width="1500" height="760" class="canvas"/>
<rect x="24" y="24" width="1452" height="712" rx="22" class="panel"/>
<title>Same-model paper calibration bridge</title>
<desc>Visual bridge showing only exact same-model saved/prior evidence. Near-family or reference-family rows are excluded from the one-to-one calibration bars.</desc>
<text x="48" y="64" class="title">Same-Model Paper Calibration Bridge</text>
<text x="48" y="90" class="subtitle">Only exact same-model evidence is plotted here. Near-family, reference-family, route-probe, blocked, and proxy rows are deliberately excluded from the bars.</text>
<text x="48" y="112" class="subtitle">UniMoral Llama 3.1 8B is action-prediction saved/prior evidence; CCD Mistral Nemo is distributional behavior, not accuracy.</text>
<text x="56" y="156" class="tiny">BENCHMARK</text>
<text x="198" y="156" class="tiny">PAPER / REFERENCE SIDE</text>
<text x="500" y="156" class="tiny">THIS REPO SIDE</text>
<text x="796" y="156" class="tiny">NUMERIC BRIDGE WHERE VALID</text>
<text x="1198" y="156" class="tiny">STATUS AND READER RULE</text>
<rect x="42" y="176" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="176" width="8" height="84" rx="4" fill="#b45309"/>
<text x="56" y="203" class="label">UniMoral</text>
<text x="198" y="199" class="body">Llama-3.1-8B Instruct: Paper includes Llama 3.1</text>
<text x="198" y="216" class="body">8B RQ tables; visible metric anchors are tracked</text>
<text x="198" y="233" class="body">in the RQ-level CSV.</text>
<text x="500" y="199" class="body">May 13 Llama 3.1 8B saved row: Saved/prior</text>
<text x="500" y="216" class="body">RQ1 action accuracy 0.639.</text>
<text x="796" y="212" class="small">no tracked paper-side value</text>
<circle cx="1182" cy="204" r="7" fill="#b45309"/>
<text x="1198" y="204" class="body">Exact same model, saved/prior: Use</text>
<text x="1198" y="221" class="body">only as action-prediction calibration;</text>
<text x="1198" y="238" class="body">not a fresh full RQ1-RQ4 rerun.</text>
<rect x="42" y="274" width="1416" height="84" rx="14" class="subpanel"/>
<rect x="42" y="274" width="8" height="84" rx="4" fill="#b45309"/>
<text x="56" y="301" class="label">CCD-Bench</text>
<text x="198" y="297" class="body">Mistral Nemo: Paper top Nordic Europe 19.0%.</text>
<text x="500" y="297" class="body">May 13 Mistral Nemo: Saved/prior Nordic</text>
<text x="500" y="314" class="body">Europe 25.3%; effective clusters 7.22.</text>
<rect x="796" y="294" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="294" width="103.1" height="16" rx="8" fill="#2563eb"/>
<text x="996" y="307" class="small">paper 19.0%</text>
<rect x="796" y="322" width="190" height="16" rx="8" class="muted-bar"/>
<rect x="796" y="322" width="137.3" height="16" rx="8" fill="#0f766e"/>
<text x="996" y="335" class="small">ours 25.3%</text>
<circle cx="1182" cy="302" r="7" fill="#b45309"/>
<text x="1198" y="302" class="body">Exact same model, saved/prior: Use as</text>
<text x="1198" y="319" class="body">CCD distribution calibration, not</text>
<text x="1198" y="336" class="body">accuracy and not a fresh rerun.</text>
<text x="48" y="398" class="metric">Not in the same-model bridge</text>
<text x="48" y="422" class="subtitle">These categories stay visible as audit context, but they are not plotted as paper-model calibration comparisons.</text>
<rect x="48" y="446" width="440" height="128" rx="14" class="subpanel"/>
<rect x="48" y="446" width="8" height="128" rx="4" fill="#7c3aed"/>
<text x="70" y="478" class="label">Near-family rows not plotted</text>
<text x="70" y="512" class="body">Llama, OpenAI, DeepSeek, and Qwen current rows differ</text>
<text x="70" y="529" class="body">by route or version. They remain context in CSVs, not</text>
<text x="70" y="546" class="body">one-to-one calibration bars.</text>
<rect x="518" y="446" width="440" height="128" rx="14" class="subpanel"/>
<rect x="518" y="446" width="8" height="128" rx="4" fill="#64748b"/>
<text x="540" y="478" class="label">Blocked exact paper routes</text>
<text x="540" y="512" class="body">Phi-3.5 mini, DeepSeek-R1-Distill-Llama-8B, Kaleido</text>
<text x="540" y="529" class="body">models, Claude/Gemini/Phi/Jamba/Sonar/Grok, and</text>
<text x="540" y="546" class="body">MoralPrompt routes are not exact completed local rows</text>
<text x="540" y="563" class="body">here.</text>
<rect x="988" y="446" width="440" height="128" rx="14" class="subpanel"/>
<rect x="988" y="446" width="8" height="128" rx="4" fill="#b45309"/>
<text x="1010" y="478" class="label">Route probes are not results</text>
<text x="1010" y="512" class="body">Fresh May 21 Llama 3.1 and Mistral Nemo checks were</text>
<text x="1010" y="529" class="body">1-sample route probes. The plotted evidence is</text>
<text x="1010" y="546" class="body">saved/prior full artifacts only.</text>
<text x="48" y="702" class="small">Source tables: paper-result-alignment.csv, paper-model-overlap-map.csv, CCD choice distributions, and saved/prior May 13 artifacts. Near-family rows are not plotted.</text>
</svg>
