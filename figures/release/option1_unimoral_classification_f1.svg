<rect width="100%" height="100%" fill="white"/>
<text x="24" y="34" class="title">UniMoral classification weighted F1 (paper metric, RQ1-RQ3)</text>
<text x="24" y="58" class="subtitle">F1 is higher-better: it balances precision (right when predicted) and recall (found the right class when present).</text>
<text x="24" y="78" class="subtitle">The UniMoral paper reports AP/RQ1, MTC/RQ2, and FAA/RQ3 with weighted F1 to handle class variability.</text>
<text x="24" y="98" class="subtitle">Current frozen RQ1 source exposes action accuracy only, so RQ1 F1 is marked unavailable instead of being fabricated.</text>
