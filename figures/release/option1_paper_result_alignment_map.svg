<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 760" role="img" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto">
<defs>
<linearGradient id="panelGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#f8fafc"/>
</linearGradient>
<pattern id="diagonalHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="8" stroke="#cdd6e1" stroke-width="3"/>
</pattern>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9fb0c2" flood-opacity="0.18"/>
</filter>
<style>
.canvas { fill: #f3f6fa; }
.title { font: 700 26px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #12263a; }
.subtitle { font: 400 14px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #5c6b7a; }
.axis { font: 600 14px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.label { font: 500 13px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.metric { font: 700 20px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #12263a; }
.celltext { font: 700 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
.celltext-dark { font: 700 16px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #173042; }
.cellsub { font: 500 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: rgba(255,255,255,0.88); }
.cellsub-dark { font: 600 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #385062; }
.body { font: 500 12px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #22313f; }
.small { font: 500 11px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #5c6b7a; }
.tiny { font: 600 10px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #6b7c8f; letter-spacing: 0.04em; }
.grid { fill: #ffffff; stroke: #d7dee6; stroke-width: 1.25; }
.panel { fill: url(#panelGradient); stroke: #dbe4ee; stroke-width: 1.25; filter: url(#softShadow); }
.subpanel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
.legend-card { fill: #ffffff; stroke: #dbe4ee; stroke-width: 1; }
.guide { stroke: #d7dee6; stroke-width: 1; stroke-dasharray: 4 6; }
.baseline { stroke: #aab7c6; stroke-width: 1.1; }
.muted-cell { fill: #eef2f7; stroke: #d7dee6; stroke-width: 1; }
.muted-bar { fill: #ecf1f6; stroke: #d7dee6; stroke-width: 1; }
.outline { stroke: rgba(255,255,255,0.9); stroke-width: 1; }
</style>
</defs>
<rect x="0" y="0" width="1220" height="760" class="canvas"/>
<rect x="24" y="24" width="1172" height="712" rx="22" class="panel"/>
<title>Paper-vs-current replication and calibration map</title>
<desc>Reviewer-facing map showing where original-paper model/result evidence overlaps with current release rows, where only current benchmark comparison is supported, and where paper-faithful replication is blocked or proxy-only.</desc>
<text x="48" y="64" class="title">Paper-vs-current Replication Map</text>
<text x="48" y="90" class="subtitle">Use this as the visual index for replication/calibration: paper-faithful overlap, saved/prior evidence, current-only comparisons,</text>
<text x="48" y="110" class="subtitle">blocked model access, and proxy-only evidence stay separate.</text>
<text x="58" y="144" class="tiny">BENCHMARK</text>
<text x="220" y="144" class="tiny">ORIGINAL PAPER / REFERENCE SIDE</text>
<text x="510" y="144" class="tiny">CURRENT REPO RESULT SIDE</text>
<text x="824" y="144" class="tiny">SAFE COMPARISON CLAIM</text>
<rect x="42" y="146" width="1136" height="80" rx="18" class="subpanel"/>
<rect x="58" y="166" width="116" height="36" rx="11" fill="#d97706"/>
<text x="116" y="181" text-anchor="middle" class="cellsub">UniMoral</text>
<rect x="824" y="204" width="164" height="24" rx="10" fill="#d97706" opacity="0.92"/>
<text x="906" y="221" text-anchor="middle" class="cellsub">Partial overlap</text>
<text x="220" y="172" class="body">RQ1 action-prediction accuracy;</text>
<text x="220" y="188" class="body">original table values not tracked</text>
<text x="220" y="204" class="body">here.</text>
<text x="510" y="172" class="body">Current RQ1 accuracy rows plus</text>
<text x="510" y="188" class="body">saved/prior May 13 Llama 3.1 8B</text>
<text x="510" y="204" class="body">evidence.</text>
<text x="824" y="174" class="body">Partial overlap: same RQ1 metric,</text>
<text x="824" y="190" class="body">saved/prior overlap only.</text>
<rect x="42" y="238" width="1136" height="80" rx="18" class="subpanel"/>
<rect x="58" y="258" width="116" height="36" rx="11" fill="#64748b"/>
<text x="116" y="273" text-anchor="middle" class="cellsub">SMID</text>
<rect x="824" y="296" width="164" height="24" rx="10" fill="#64748b" opacity="0.92"/>
<text x="906" y="313" text-anchor="middle" class="cellsub">No paper roster</text>
<text x="220" y="264" class="body">Human-normed image stimulus set; no</text>
<text x="220" y="280" class="body">original LLM roster found locally.</text>
<text x="510" y="264" class="body">Current vision-route moral-rating and</text>
<text x="510" y="280" class="body">foundation-classification rows.</text>
<text x="824" y="266" class="body">No paper-model comparison; compare current</text>
<text x="824" y="282" class="body">vision-capable rows only.</text>
<rect x="42" y="330" width="1136" height="80" rx="18" class="subpanel"/>
<rect x="58" y="350" width="116" height="36" rx="11" fill="#7c3aed"/>
<text x="116" y="365" text-anchor="middle" class="cellsub">Value</text>
<text x="116" y="379" text-anchor="middle" class="cellsub">Kaleidoscope /</text>
<rect x="824" y="388" width="164" height="24" rx="10" fill="#7c3aed" opacity="0.92"/>
<text x="906" y="405" text-anchor="middle" class="cellsub">Blocked route</text>
<text x="220" y="356" class="body">Kaleido model family and ValuePrism</text>
<text x="220" y="372" class="body">relevance/valence setup.</text>
<text x="510" y="356" class="body">Prompt-based LLM relevance and valence</text>
<text x="510" y="372" class="body">classification rows.</text>
<text x="824" y="358" class="body">Blocked for paper-model replication until</text>
<text x="824" y="374" class="body">Kaleido access and execution are run.</text>
<rect x="42" y="422" width="1136" height="80" rx="18" class="subpanel"/>
<rect x="58" y="442" width="116" height="36" rx="11" fill="#0f766e"/>
<text x="116" y="457" text-anchor="middle" class="cellsub">CCD-Bench</text>
<rect x="824" y="480" width="164" height="24" rx="10" fill="#0f766e" opacity="0.92"/>
<text x="906" y="497" text-anchor="middle" class="cellsub">Behavior map</text>
<text x="220" y="448" class="body">Ten-cluster cultural-choice behavior</text>
<text x="220" y="464" class="body">and concentration metrics.</text>
<text x="510" y="448" class="body">Choice distributions, dominant-cluster</text>
<text x="510" y="464" class="body">share, and effective clusters.</text>
<text x="824" y="450" class="body">Distributional comparison only; do not</text>
<text x="824" y="466" class="body">read CCD as accuracy.</text>
<rect x="42" y="514" width="1136" height="80" rx="18" class="subpanel"/>
<rect x="58" y="534" width="116" height="36" rx="11" fill="#b45309"/>
<text x="116" y="549" text-anchor="middle" class="cellsub">DeNEVIL /</text>
<text x="116" y="563" text-anchor="middle" class="cellsub">MoralPrompt</text>
<rect x="824" y="572" width="164" height="24" rx="10" fill="#b45309" opacity="0.92"/>
<text x="906" y="589" text-anchor="middle" class="cellsub">Proxy only</text>
<text x="220" y="540" class="body">Paper-faithful MoralPrompt export is</text>
<text x="220" y="556" class="body">missing locally.</text>
<text x="510" y="540" class="body">FULCRA-backed proxy visible-behavior</text>
<text x="510" y="556" class="body">summaries from saved traces.</text>
<text x="824" y="542" class="body">Proxy-only evidence; no paper-faithful</text>
<text x="824" y="558" class="body">MoralPrompt comparison.</text>
<rect x="48" y="646" width="1124" height="54" rx="16" class="legend-card"/>
<text x="72" y="670" class="tiny">READ THIS FIGURE</text>
<text x="72" y="692" class="body">Only UniMoral RQ1 has a clean paper-faithful metric overlap here; CCD is distributional behavior, DeNEVIL is proxy-only, and Value/Kaleido is</text>
<text x="72" y="709" class="body">blocked until the gated model route is run.</text>
</svg>
