<rect x="0" y="0" width="1280" height="1100" class="canvas"/>
<rect x="24" y="24" width="1232" height="1052" rx="22" class="panel"/>
<title>Family scaling profile by benchmark</title>
<desc>Two-panel family scaling view for SMID and Value Kaleidoscope after the separate UniMoral RQ1-RQ4 dashboard. GPT4 only is plotted as a one-model text-only reference point rather than a size curve. DeepSeek-S, DeepSeek-M, DeepSeek-L, Qwen-M, and Llama-M have text-side points where scored, while their SMID cells are unavailable because no public vision route exists. CCD-Bench and Denevil are intentionally excluded from this line chart because they are reported separately as coverage and proxy evidence rather than benchmark-faithful accuracy.</desc>
<text x="48" y="64" class="title">Family Scaling Profile</text>
<text x="48" y="92" class="subtitle">UniMoral RQ1-RQ4 is shown separately above; these comparable panels start at SMID.</text>
<text x="48" y="114" class="subtitle">Two comparable benchmark panels here: SMID and Value Kaleidoscope.</text>
<text x="48" y="136" class="subtitle">This figure is reserved for benchmark-faithful comparable accuracy, not CCD coverage or Denevil proxy evidence.</text>
<text x="48" y="158" class="subtitle">GPT4 only is a one-model text-only reference point, not an S/M/L family-size curve.</text>
<text x="48" y="180" class="subtitle">SMID gaps for DeepSeek-S, DeepSeek-M, DeepSeek-L, Qwen-M, and Llama-M mean no public vision route, not missing text scores.</text>
<text x="48" y="202" class="subtitle">Read CCD-Bench and Denevil in their dedicated figures.</text>
