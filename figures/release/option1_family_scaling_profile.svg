<text x="72" y="670" class="tiny">HOW TO READ THIS FIGURE</text>
<line x1="618" y1="672" x2="618" y2="982" class="guide"/>
<text x="72" y="696" class="body">Panels 1-2 start at SMID because UniMoral</text>
<text x="72" y="722" class="body">has its own RQ1-RQ4 figure above.</text>
<text x="72" y="748" class="body">Use this figure for family-size comparisons</text>
<text x="72" y="774" class="body">on SMID and Value Kaleidoscope.</text>
<text x="72" y="800" class="body">CCD-Bench is intentionally excluded here.</text>
<text x="72" y="826" class="body">Read CCD-Bench in the choice-distribution</text>
<text x="72" y="852" class="body">and dominant-option concentration figures.</text>
<text x="72" y="878" class="body">Read Denevil in the behavioral-outcomes figure.</text>
<text x="72" y="904" class="body">Do not mix proxy evidence into accuracy scaling.</text>
<text x="656" y="696" class="tiny">FAMILY READ</text>
<rect x="656" y="710" width="14" height="14" rx="4" fill="#d97706"/>
<text x="680" y="721" class="small">MiniMax: Value S/M/L are scored; SMID S/L have routes, while M has no SMID route.</text>
<rect x="656" y="740" width="14" height="14" rx="4" fill="#0d9488"/>
<text x="680" y="751" class="small">Qwen: Value scored at S/M/L; SMID at S/L.</text>
<rect x="656" y="770" width="14" height="14" rx="4" fill="#2563eb"/>
<text x="680" y="781" class="small">DeepSeek: Value S/M/L are parsed from saved logs; no DeepSeek SMID route exists.</text>
<rect x="656" y="800" width="14" height="14" rx="4" fill="#ea580c"/>
<text x="680" y="811" class="small">Llama: Value scored at S/M/L; SMID at S/L.</text>
<rect x="656" y="830" width="14" height="14" rx="4" fill="#8b5cf6"/>
<text x="680" y="841" class="small">Gemma: full S/M/L sweep on SMID and Value.</text>
<rect x="656" y="860" width="14" height="14" rx="4" fill="#111827"/>
<text x="680" y="871" class="small">GPT4 only: GPT4-only reference point; no GPT4 S/M/L or SMID route is claimed.</text>
<text x="656" y="910" class="tiny">EVIDENCE BOUNDARY</text>
<text x="656" y="936" class="body">This figure starts after the UniMoral RQ1-RQ4 dashboard.</text>
<text x="656" y="964" class="body">It stops at SMID + Value to avoid repeating UniMoral.</text>
<text x="656" y="992" class="body">That avoids mixing comparable accuracy with coverage or proxy evidence.</text>
<text x="72" y="1044" class="small">Takeaway: current evidence supports task-specific scaling statements on SMID and Value, while UniMoral scaling is handled in the RQ1-RQ4 panel.</text>
