<text x="656" y="912" class="tiny">EVIDENCE BOUNDARY</text>
<text x="656" y="938" class="body">This figure starts after the combined UniMoral benchmark block.</text>
<text x="656" y="966" class="body">It stops at SMID + Value to avoid repeating UniMoral.</text>
<text x="656" y="994" class="body">That avoids mixing comparable accuracy with coverage or proxy evidence.</text>
<text x="72" y="1044" class="small">Takeaway: current evidence supports task-specific scaling statements on SMID and Value, while UniMoral scaling is handled in the RQ1-RQ4 panel.</text>
