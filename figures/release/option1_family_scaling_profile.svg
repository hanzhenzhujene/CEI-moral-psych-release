<title>Family scaling profile by benchmark</title>
<desc>Two-panel family scaling view for SMID and Value Kaleidoscope after the UniMoral benchmark block. GPT-4o-mini Ref is drawn as a dashed horizontal text-only reference line rather than a size point. DeepSeek-S, DeepSeek-M, DeepSeek-L, Qwen-M, and Llama-M have text-side points where scored, while their SMID cells are unavailable because no public vision route exists. CCD-Bench and Denevil are intentionally excluded from this line chart because they are reported separately as coverage and proxy evidence rather than benchmark-faithful accuracy.</desc>
<text x="48" y="64" class="title">Family Scaling Profile</text>
<text x="48" y="92" class="subtitle">UniMoral is grouped in Figure 1 above; these comparable panels start at SMID.</text>
<text x="48" y="114" class="subtitle">Two comparable benchmark panels here: SMID and Value Kaleidoscope.</text>
<text x="48" y="136" class="subtitle">This figure is reserved for benchmark-faithful comparable accuracy, not CCD coverage or Denevil proxy evidence.</text>
<text x="48" y="158" class="subtitle">GPT-4o-mini Ref is drawn as a dashed horizontal reference line, not an S/M/L point.</text>
<text x="48" y="180" class="subtitle">SMID gaps for DeepSeek-S, DeepSeek-M, DeepSeek-L, Qwen-M, and Llama-M mean no public vision route, not missing text scores.</text>
<text x="48" y="202" class="subtitle">Read CCD-Bench and Denevil in their dedicated figures.</text>
