<text x="96" y="701" class="body">Qwen: Only the small line is currently comparable.</text>
<rect x="72" y="724" width="14" height="14" rx="4" fill="#2563eb"/>
<text x="96" y="735" class="body">DeepSeek: Only the large text line is currently comparable.</text>
