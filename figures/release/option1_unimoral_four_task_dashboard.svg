<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
<style>text{font-family:Arial,sans-serif;font-size:14px;fill:#17202a}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#4b5563}.axis{font-weight:700}.small{font-size:12px;fill:#4b5563}.card{fill:#fbfcfd;stroke:#d8dee4;rx:8}.panel{fill:white;stroke:#d8dee4;rx:8}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="36" y="44" class="title">UniMoral RQ1-RQ4 dashboard</text>
<text x="36" y="70" class="subtitle">Updated UniMoral view: action prediction is only RQ1; RQ2 typology, RQ3 attribution, and RQ4 consequence generation are shown separately.</text>
<text x="36" y="92" class="subtitle">There are four RQs. RQ1-RQ3 use one shared accuracy readout; RQ4 generation quality is kept separate so readers do not compare mixed metrics in one chart.</text>
<rect x="36" y="122" width="410" height="132" class="card"/>
<text x="54" y="152" class="axis">RQ1: Action prediction</text>
<text x="54" y="178" class="small">Metric: accuracy</text>
<text x="54" y="200" class="small">Strict complete: 16/16; reported: 16/16</text>
<text x="54" y="222" class="small">Mean/range: 0.655 / 0.121</text>
<text x="54" y="244" class="small">Top line: DeepSeek-M (0.684)</text>
<rect x="466" y="122" width="410" height="132" class="card"/>
<text x="484" y="152" class="axis">RQ2: Moral typology</text>
<text x="484" y="178" class="small">Metric: exact-match accuracy</text>
<text x="484" y="200" class="small">Strict complete: 15/16; reported: 16/16</text>
<text x="484" y="222" class="small">Mean/range: 0.581 / 0.045</text>
<text x="484" y="244" class="small">Top line: Gemma-S (0.599)</text>
<rect x="896" y="122" width="410" height="132" class="card"/>
<text x="914" y="152" class="axis">RQ3: Factor attribution</text>
<text x="914" y="178" class="small">Metric: exact-match accuracy</text>
<text x="914" y="200" class="small">Strict complete: 14/16; reported: 15/16</text>
<text x="914" y="222" class="small">Mean/range: 0.592 / 0.070</text>
<text x="914" y="244" class="small">Top line: Llama-M (0.631)</text>
<rect x="1326" y="122" width="410" height="132" class="card"/>
<text x="1344" y="152" class="axis">RQ4: Consequence generation</text>
<text x="1344" y="178" class="small">Metric: BERTScore; METEOR 0.077-0.157</text>
<text x="1344" y="200" class="small">Strict complete: 14/16; reported: 15/16</text>
<text x="1344" y="222" class="small">Mean/range: 0.691 / 0.101</text>
<text x="1344" y="244" class="small">Top line: Llama-M (0.730)</text>
<rect x="36" y="286" width="840" height="382" class="panel"/>
<text x="60" y="320" class="axis">Metric guide</text>
<text x="72" y="360" class="subtitle">RQ1 has only aggregate action accuracy in the frozen release source.</text>
<text x="72" y="394" class="subtitle">RQ2/RQ3 use the same accuracy readout in the main comparison.</text>
<text x="72" y="428" class="subtitle">RQ1-RQ3 can be read horizontally because they share the same metric.</text>
<text x="72" y="462" class="subtitle">RQ4 is generation, so it is not an exact-match accuracy task; read it separately.</text>
<rect x="916" y="286" width="848" height="382" class="panel"/>
<text x="940" y="320" class="axis">Figure guide</text>
<text x="952" y="360" class="subtitle">1. This dashboard: four RQs, coverage, and metric boundary.</text>
<text x="952" y="394" class="subtitle">2. Main UniMoral figure: RQ1-RQ3 exact-match accuracy only.</text>
<text x="952" y="428" class="subtitle">3. Generation figure: RQ4 BERTScore F1 and METEOR, separate from accuracy.</text>
<text x="952" y="462" class="subtitle">4. Classification rankings/spread use the same RQ1-RQ3 accuracy metric.</text>
<text x="952" y="496" class="subtitle">All public/reference model lines remain listed: Qwen, MiniMax, DeepSeek, Llama, Gemma S/M/L plus GPT-4o-mini Ref.</text>
<rect x="36" y="720" width="1728" height="292" fill="#fbfcfd" stroke="#d8dee4" rx="8"/>
<text x="60" y="754" class="axis">Coverage readout</text>
<text x="60" y="782" class="subtitle">Complete four-task lines outside MiniMax: Qwen-S/M/L, DeepSeek-S/M/L, Llama-S/M/L, Gemma-S/M/L, and GPT-4o-mini Ref (13/13 lines).</text>
<text x="60" y="808" class="subtitle">MiniMax is included where scored, but strict completion is still blocked by documented parse/recovery gaps in RQ2/RQ3/RQ4.</text>
