<text x="60" y="972" class="small">The full score heatmap includes Qwen/MiniMax/DeepSeek/Llama/Gemma S-M-L plus OpenAI GPT-5 S/M/L and GPT-4o/GPT-4.1 text refs.</text>
<text x="60" y="996" class="small">MiniMax remaining gaps are documented in unimoral-failure-checklist.csv; GPT-4.1 action-only refs are scope boundaries, not failed RQ2/RQ3/RQ4 runs.</text>
