<circle cx="1482" cy="871" r="7" fill="#bf977a"/>
<text x="1500" y="866" class="axis">MiniMax</text>
<text x="1500" y="886" class="small">caveats: see failure checklist</text>
<text x="60" y="934" class="small">All run lines are shown in the full score heatmap and all-line ranking below: Qwen/MiniMax/DeepSeek/Llama/Gemma S-M-L plus GPT-4o-mini Ref.</text>
