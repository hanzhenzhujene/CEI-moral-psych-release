<text x="58" y="552" class="small">Kumar et al. (ACL Findings</text>
<text x="58" y="567" class="small">2025)</text>
<text x="292" y="514" class="body">BERTScore 87.44</text>
<text x="720" y="514" class="body">Best current BERTScore F1: Llama-M 0.730;</text>
<text x="720" y="531" class="body">GPT-5.5 0.725</text>
<circle cx="1118" cy="518" r="7" fill="#b45309"/>
<text x="1136" y="517" class="body">Metric family overlaps; scorer scale</text>
<text x="1136" y="534" class="body">and model roster differ</text>
