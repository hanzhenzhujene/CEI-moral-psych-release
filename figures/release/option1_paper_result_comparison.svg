<text x="1136" y="644" class="body">and model roster differ</text>
<rect x="42" y="710" width="1416" height="94" rx="14" class="subpanel"/>
<rect x="42" y="710" width="8" height="94" rx="4" fill="#64748b"/>
<text x="58" y="734" class="label">SMID</text>
<text x="58" y="772" class="small">Crone et al. (PLOS ONE 2018)</text>
<text x="292" y="734" class="body">2,941 images; 2,716 participants; 820,565 ratings;</text>
<text x="292" y="751" class="body">mean 34.88 ratings/image; averaged norms ICC &gt;= .75</text>
<text x="720" y="734" class="body">Best current SMID average accuracy: Qwen-L</text>
<text x="720" y="751" class="body">0.483; current mean 0.364</text>
<circle cx="1118" cy="738" r="7" fill="#64748b"/>
