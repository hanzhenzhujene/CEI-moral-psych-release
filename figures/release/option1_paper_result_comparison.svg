<text x="58" y="332" class="small">Kumar et al. (ACL Findings</text>
<text x="58" y="347" class="small">2025)</text>
<text x="292" y="294" class="body">57.01 (Llama-3.1-8B Instruct, Spanish)</text>
<text x="720" y="294" class="body">Best accuracy: Gemma-S 0.599; best weighted-F1</text>
<text x="720" y="311" class="body">bridge: Llama-S 0.354</text>
