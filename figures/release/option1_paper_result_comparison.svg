<text x="58" y="641" class="label">generation - METEOR</text>
<text x="58" y="662" class="small">Kumar et al. (ACL Findings</text>
<text x="58" y="677" class="small">2025)</text>
<text x="292" y="624" class="body">METEOR 19.08</text>
<text x="720" y="624" class="body">Best current METEOR: GPT-5.5 0.165; Llama-L</text>
<text x="720" y="641" class="body">0.157</text>
<circle cx="1118" cy="628" r="7" fill="#b45309"/>
