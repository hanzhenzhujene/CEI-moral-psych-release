<text x="1136" y="314" class="body">while the release headline uses</text>
<text x="1136" y="331" class="body">accuracy</text>
<rect x="42" y="380" width="1416" height="94" rx="14" class="subpanel"/>
<rect x="42" y="380" width="8" height="94" rx="4" fill="#2563eb"/>
<text x="58" y="404" class="label">UniMoral RQ3 factor</text>
<text x="58" y="421" class="label">attribution</text>
<text x="58" y="442" class="small">Kumar et al. (ACL Findings</text>
<text x="58" y="457" class="small">2025)</text>
<text x="292" y="404" class="body">38.59 (Llama-3.1-8B Instruct, Russian)</text>
<text x="720" y="404" class="body">Best accuracy: Llama-M 0.631; best weighted-F1</text>
<text x="720" y="421" class="body">bridge: DeepSeek-S 0.264</text>
<circle cx="1118" cy="408" r="7" fill="#2563eb"/>
<text x="1136" y="407" class="body">Same benchmark; paper uses weighted F1</text>
<text x="1136" y="424" class="body">while the release headline uses</text>
<text x="1136" y="441" class="body">accuracy</text>
