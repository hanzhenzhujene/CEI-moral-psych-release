<text x="1136" y="847" class="body">Same source family, not Kaleido model</text>
<text x="1136" y="864" class="body">replication</text>
<rect x="42" y="930" width="1416" height="94" rx="14" class="subpanel"/>
<rect x="42" y="930" width="8" height="94" rx="4" fill="#2563eb"/>
<text x="58" y="954" class="label">CCD-Bench</text>
<text x="58" y="992" class="small">Rahman and Salam (2025)</text>
<text x="292" y="954" class="body">2,182 dilemmas; 17 LLMs; Mean cluster shares across</text>
<text x="292" y="971" class="body">the paper/source 17-model analysis: Nordic Europe</text>
<text x="292" y="988" class="body">20.17%, Germanic Europe 12.36%, Sub-Saharan Africa</text>
<text x="292" y="1005" class="body">11.51%, Anglo 11.31%, Southern Asia 10.06%, Latin...</text>
<text x="720" y="954" class="body">Same-model saved/prior row: Mistral Nemo</text>
<text x="720" y="971" class="body">2,178/2,182 valid choices; Nordic Europe 25.3%;</text>
<text x="720" y="988" class="body">effective clusters 7.22. Current release</text>
<text x="720" y="1005" class="body">context: 19/20 rows are Nordic Europe dominant.</text>
<circle cx="1118" cy="958" r="7" fill="#2563eb"/>
<text x="1136" y="957" class="body">Same-model saved/prior behavioral</text>
<text x="1136" y="974" class="body">bridge; CCD-Bench is not accuracy</text>
<rect x="42" y="1040" width="1416" height="94" rx="14" class="subpanel"/>
<rect x="42" y="1040" width="8" height="94" rx="4" fill="#991b1b"/>
<text x="58" y="1064" class="label">DeNEVIL / MoralPrompt</text>
<text x="58" y="1102" class="small">Duan et al. (ICLR 2024)</text>
<text x="292" y="1064" class="body">MoralPrompt has 2,397 prompts / 522 principles;</text>
<text x="292" y="1081" class="body">ChatGPT-prompt Table 16 reports ChatGPT APV 65.20 +/-</text>
<text x="292" y="1098" class="body">26.45, GPT-4 APV 79.08 +/- 21.46, LLaMA-2-70B-chat APV</text>
<text x="292" y="1115" class="body">76.94 +/- 18.86</text>
<text x="720" y="1064" class="body">APV/EVR/MVP n/a; strongest proxy</text>
<text x="720" y="1081" class="body">protective-response rate is Qwen-M 99.5%; all</text>
<text x="720" y="1098" class="body">DeNEVIL proxy rows remain not T3.</text>
<circle cx="1118" cy="1068" r="7" fill="#991b1b"/>
