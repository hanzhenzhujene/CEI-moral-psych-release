<rect x="42" y="522" width="1416" height="110" rx="14" class="subpanel"/>
<rect x="42" y="522" width="8" height="110" rx="4" fill="#b45309"/>
<text x="58" y="546" class="label">UniMoral RQ4 consequence</text>
<text x="58" y="564" class="label">generation</text>
<text x="306" y="546" class="body">BLEU 3.29; METEOR 19.08; BERTScore 87.44</text>
<text x="752" y="546" class="body">BERTScore F1: Llama-M 0.730; METEOR: Llama-L 0.157; BLEU:</text>
<text x="752" y="564" class="body">Llama-M 0.0166</text>
<text x="1210" y="546" class="body">Metric family overlaps;</text>
<text x="1210" y="564" class="body">scorer scale and model</text>
<text x="1210" y="582" class="body">roster differ</text>
<circle cx="1192" cy="544" r="7" fill="#b45309"/>
<rect x="42" y="646" width="1416" height="110" rx="14" class="subpanel"/>
<rect x="42" y="646" width="8" height="110" rx="4" fill="#475569"/>
<text x="58" y="670" class="label">SMID</text>
<text x="306" y="670" class="body">2,941 images; 2,716 participants; 820,565 ratings; mean</text>
<text x="306" y="688" class="body">34.88 ratings/image; averaged norms ICC &gt;= .75</text>
<text x="752" y="670" class="body">Best current SMID average accuracy: Qwen-L 0.483; current</text>
<text x="752" y="688" class="body">mean 0.364</text>
<text x="1210" y="670" class="body">No paper model leaderboard</text>
<circle cx="1192" cy="668" r="7" fill="#475569"/>
<rect x="42" y="770" width="1416" height="110" rx="14" class="subpanel"/>
<rect x="42" y="770" width="8" height="110" rx="4" fill="#b45309"/>
<text x="58" y="794" class="label">Value Kaleidoscope /</text>
<text x="58" y="812" class="label">ValuePrism</text>
<text x="306" y="794" class="body">ValuePrism has 218k value/rights/duties for 31k</text>
<text x="306" y="812" class="body">situations; 91% high-quality; KAL SYS 11B overall win rate</text>
<text x="306" y="830" class="body">58.3 vs GPT-4, accuracy win 62.5; GPT-4 valence</text>
<text x="306" y="848" class="body">correctness 93.1</text>
<text x="752" y="794" class="body">Best current prompt-based Value average: MiniMax-L 0.741;</text>
<text x="752" y="812" class="body">best OpenAI text ref: GPT-5-mini Ref 0.739</text>
<text x="1210" y="794" class="body">Same source family, not</text>
<text x="1210" y="812" class="body">Kaleido model replication</text>
<circle cx="1192" cy="792" r="7" fill="#b45309"/>
<rect x="42" y="894" width="1416" height="110" rx="14" class="subpanel"/>
<rect x="42" y="894" width="8" height="110" rx="4" fill="#0f766e"/>
<text x="58" y="918" class="label">CCD-Bench</text>
<text x="306" y="918" class="body">2,182 dilemmas; 17 LLMs; Nordic Europe 20.2%, Germanic</text>
<text x="306" y="936" class="body">Europe 12.4%; Eastern Europe and MENA about 5-6%; plural</text>
<text x="306" y="954" class="body">rationales 87.9%; position-bias Cramer's V 0.0586</text>
<text x="752" y="918" class="body">19/20 current release rows are Nordic Europe dominant;</text>
<text x="752" y="936" class="body">GPT-5-nano Ref: option_6 (Nordic Europe) at 27.8%;</text>
<text x="752" y="954" class="body">effective clusters 6.79; DeepSeek-S: option_7 (Sub Saharan</text>
<text x="752" y="972" class="body">Africa) at 13.8%; effective clusters 9.57</text>
<text x="1210" y="918" class="body">Direct behavioral</text>
<text x="1210" y="936" class="body">comparison, but CCD-Bench is</text>
<text x="1210" y="954" class="body">not accuracy</text>
<circle cx="1192" cy="916" r="7" fill="#0f766e"/>
<rect x="42" y="1018" width="1416" height="110" rx="14" class="subpanel"/>
<rect x="42" y="1018" width="8" height="110" rx="4" fill="#b91c1c"/>
<text x="58" y="1042" class="label">DeNEVIL / MoralPrompt</text>
<text x="306" y="1042" class="body">MoralPrompt has 2,397 prompts / 522 principles;</text>
<text x="306" y="1060" class="body">ChatGPT-prompt Table 16 reports ChatGPT APV 65.20 +/-</text>
<text x="306" y="1078" class="body">26.45, GPT-4 APV 79.08 +/- 21.46, LLaMA-2-70B-chat APV</text>
<text x="306" y="1096" class="body">76.94 +/- 18.86</text>
<text x="752" y="1042" class="body">APV/EVR/MVP n/a; strongest proxy protective-response rate</text>
<text x="752" y="1060" class="body">is Qwen-M 99.5%; all DeNEVIL proxy rows remain not T3.</text>
<text x="1210" y="1042" class="body">Blocked/proxy only; not</text>
<text x="1210" y="1060" class="body">paper-faithful MoralPrompt</text>
<text x="1210" y="1078" class="body">and not T3</text>
<circle cx="1192" cy="1040" r="7" fill="#b91c1c"/>
<rect x="58" y="1193" width="20" height="20" rx="5" fill="#0f766e"/>
<text x="88" y="1208" class="label">Direct behavior comparison</text>
<rect x="398" y="1193" width="20" height="20" rx="5" fill="#b45309"/>
