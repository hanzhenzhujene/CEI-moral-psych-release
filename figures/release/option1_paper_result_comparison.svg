<text x="306" y="298" class="body">57.01 (Llama-3.1-8B Instruct, Spanish)</text>
<text x="752" y="298" class="body">Best accuracy: Gemma-S 0.599; best weighted-F1 bridge:</text>
<text x="752" y="316" class="body">Llama-S 0.354</text>
<text x="1210" y="298" class="body">Same benchmark; paper uses</text>
<text x="1210" y="316" class="body">weighted F1 while the</text>
<text x="1210" y="334" class="body">release headline uses</text>
<text x="1210" y="352" class="body">accuracy</text>
<circle cx="1192" cy="296" r="7" fill="#2563eb"/>
<rect x="42" y="398" width="1416" height="110" rx="14" class="subpanel"/>
<rect x="42" y="398" width="8" height="110" rx="4" fill="#2563eb"/>
<text x="58" y="422" class="label">UniMoral RQ3 factor</text>
<text x="58" y="440" class="label">attribution</text>
<text x="306" y="422" class="body">38.59 (Llama-3.1-8B Instruct, Russian)</text>
<text x="752" y="422" class="body">Best accuracy: Llama-M 0.631; best weighted-F1 bridge:</text>
<text x="752" y="440" class="body">DeepSeek-S 0.264</text>
<text x="1210" y="422" class="body">Same benchmark; paper uses</text>
<text x="1210" y="440" class="body">weighted F1 while the</text>
<text x="1210" y="458" class="body">release headline uses</text>
<text x="1210" y="476" class="body">accuracy</text>
